<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      const nilai = 80;
      const lulus = 75;
      if (nilai >= lulus) {
        console.log("Selamat, anda lulus");
      } else {
        console.log("Selamat, anda tidak lulus");
      }

      // !:not
      // !empty : tidak kosong
      const warna = "Biru";
      if (warna !== "Biru") {
        console.log("Ia betul biru");
      } else {
        console.log("bukan biru");
      }

      // banyak if, pengecekan banyak statement dan kondisi
      // else if
      const totalBelanja = 30000000; //variable tidak bisa di rubah
      const isMember = false; //variable tidak bisa di rubah
      let diskon = 0; //variable bisa di rubah

      if(isMember || totalBelanja >= 20000000){
        diskon = 0.1;
      }else if(totalBelanja >= 500000){
        diskon = 0.2;
      }else{
        diskon = 0;
      }
      const potongan = totalBelanja * diskon;
      const bayar = totalBelanja - potongan;
      //template literal
      //`` : backtick

    // console.log("Potongan harga : " + potongan)
      console.log(`Total Belanja : ${totalBelanja}`)
      console.log(`Potongan harga : ${potongan}`)
      console.log(`TotalBayar : ${bayar}`)

      //switch
      const color = "kuning"
      switch(color){
        case "Biru":
            console.log("Iya, biru");
            break;
        default:
            console.log("Bukan biru");
            break;
        case "Merah":
            console.log("Iya Merah");
      }


    </script>
  </body>
</html>
