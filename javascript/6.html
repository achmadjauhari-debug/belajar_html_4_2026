//object : struktur data, kalau array pakai kurung kota [], kalau object pakai kurung kurawal {}
let peserta = {
    nama: "Reza", // key = nama, value=reza, objectnya=nama
    alamat: "Bekasi Jawa Barat",
    jurusan: "Web Programming",
}
// kalau di dalam object manggilnya pakai titik .
//kalau keynya ada spasi tidak bisa di panggil pakai array ex. "alamat lengkap"

console.log(peserta.nama)
console.log(peserta.jurusan)
console.log(peserta["alamat"]);
//untuk tambah object baru
peserta.nilai = 80;
console.log(peserta)

delete peserta.nilai;
peserta.status = "Baru";
peserta['email'] = "reza@gmail.com"; //[] yg di panggil arraynya, bukan indexnya
console.log(peserta);

//kalau mau nambah banyak peserta menggunakan array
const siswa = [
    {
        id:1,
        nama:"Rudi",
        nilai: 80
    },
    {
        id:2,
        nama:"Wawan",
        nilai: 50
    },
    {
        id:3,
        nama: "Ratna",
        nilai: 75
    }
]
console.log(siswa);

//looping - data = variable alias
siswa.forEach(function(data, index){console.log("siswa", data)}); //function biasa

// es 6 : ecmascript Arrow Function array.forEach(element => { });
siswa.forEach((data, index) => {
    console.log("data siswa", data),
    console.log(`data siswa dengan index ${index} yaitu bernama ${data.nama}`)
});

const siswaLulus = siswa.filter((s) => {return s.nilai >= 75})

console.log(siswaLulus);
